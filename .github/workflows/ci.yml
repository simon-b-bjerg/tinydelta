name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', stable] # 1.21 is the oldest version go.mod allows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # the module has no dependencies, so no go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (includes the C decoders, built with the runner's gcc)
        run: go test ./...
      - name: Fuzz encode/decode round trips (60 s)
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzEncodeRoundTrip$' -fuzztime 60s .

  windows:
    name: Go tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Test (Go library and CLI)
        run: go test ./...

  c-arm:
    name: C library on 32-bit ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install ARM toolchains and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user gcc-arm-none-eabi
      - name: Strict build (host and ARM)
        run: |
          scripts/c-check.sh gcc
          scripts/c-check.sh arm-linux-gnueabihf-gcc
      - name: C decoders against the Go decoder, on 32-bit ARM (QEMU)
        env:
          TINYDELTA_CC: arm-linux-gnueabihf-gcc -static
          TINYDELTA_C_RUNNER: qemu-arm
        run: go test -run 'TestC' -v .
      - name: Code size (Cortex-M)
        run: scripts/c-size.sh | tee -a "$GITHUB_STEP_SUMMARY"
