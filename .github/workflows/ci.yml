name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', stable] # 1.21 is the oldest version go.mod allows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # the module has no dependencies, so no go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (includes the C decoders, built with the runner's gcc)
        run: go test ./...
      - name: Locate the fuzz cache
        if: matrix.go == 'stable'
        run: echo "FUZZ_CACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      # Start from the nightly fuzzing's corpus (fuzz-nightly.yml); read only.
      - name: Restore the nightly fuzz corpus
        if: matrix.go == 'stable'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FUZZ_CACHE }}
          key: go-fuzz-corpus-none
          restore-keys: go-fuzz-corpus-
      - name: Fuzz encode/decode round trips (60 s)
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzEncodeRoundTrip$' -fuzztime 60s .
      - name: Hex dump failing fuzz inputs
        if: failure() && matrix.go == 'stable'
        run: |
          for f in $(git ls-files --others --exclude-standard testdata/fuzz); do
            echo "== $f"
            TINYDELTA_FUZZ_DUMP="$f" go test -count=1 -run '^TestDumpFuzzInput$' -v . |
              grep -v '^=== RUN\|^--- PASS\|^PASS$\|^ok '
            echo "::error title=Go fuzzer failing input ($f)::$(sed 's/%/%25/g' "$f" | awk '{ printf "%s%%0A", $0 }')"
          done
      - name: Upload failing fuzz inputs
        if: failure() && matrix.go == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: go-fuzz-failures
          path: testdata/fuzz/
          if-no-files-found: ignore

  c-fuzz:
    name: C decoders fuzzed (ASan + UBSan)
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install clang with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev llvm-18
      # Start from the nightly fuzzing's corpus (fuzz-nightly.yml); read only.
      - name: Restore the nightly fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus
          key: c-fuzz-corpus-none
          restore-keys: c-fuzz-corpus-
      - name: Fuzz for 60 s
        env:
          CLANG: clang-18
        run: scripts/c-fuzz.sh 60 fuzz-corpus
      - name: Coverage of the C library by the fuzzer
        id: coverage
        env:
          CLANG: clang-18
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV: llvm-cov-18
        run: |
          scripts/c-coverage.sh fuzz-corpus | tee "$RUNNER_TEMP/c-coverage.md"
          cat "$RUNNER_TEMP/c-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=C coverage::$(sed 's/%/%25/g' "$RUNNER_TEMP/c-coverage.md" | awk '{ printf "%s%%0A", $0 }')"
          echo "lines=$(sed -n 's/^Total line coverage: \([0-9.]*\)%$/\1/p' "$RUNNER_TEMP/c-coverage.md")" >> "$GITHUB_OUTPUT"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c-fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  c-analyze:
    name: C static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, clang-tidy, clang-format and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18 clang-format-18 cppcheck
      - name: Formatting (c/.clang-format)
        env:
          CLANG_FORMAT: clang-format-18
        run: scripts/c-format.sh
      - name: GCC analyzer, Clang Static Analyzer, clang-tidy and cppcheck MISRA
        env:
          CLANG: clang-18
          CLANG_TIDY: clang-tidy-18
        run: scripts/c-analyze.sh

  c-cbmc:
    name: C decoders model-checked (CBMC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cbmc
      - name: Every input up to small bounds
        run: scripts/c-cbmc.sh

  python:
    name: Python package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.x'] # oldest supported and current
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests against a fresh build of the tool
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./cmd/tinydelta
          export TINYDELTA_BIN="$RUNNER_TEMP/bin/tinydelta${{ runner.os == 'Windows' && '.exe' || '' }}"
          PYTHONPATH=python/src python -m unittest discover -s python/tests -v
      - name: Build the wheels, check them, and test the installed Linux wheel
        if: runner.os == 'Linux' && matrix.python == '3.x'
        run: |
          scripts/build-release.sh v0.0.0
          python python/build_wheels.py v0.0.0 dist "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q twine "$RUNNER_TEMP"/wheels/*x86_64*.whl
          "$RUNNER_TEMP/venv/bin/twine" check "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/venv/bin/tinydelta" version
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/python/tests" -t "$GITHUB_WORKSPACE/python/tests" -v

  windows:
    name: Go tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Test (Go library and CLI)
        run: go test ./...

  c-arm:
    name: C library on 32-bit ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install ARM toolchains and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user gcc-arm-none-eabi
      - name: Strict build (host and ARM)
        run: |
          scripts/c-check.sh gcc
          scripts/c-check.sh arm-linux-gnueabihf-gcc
      - name: C decoders against the Go decoder, on 32-bit ARM (QEMU)
        env:
          TINYDELTA_CC: arm-linux-gnueabihf-gcc -static
          TINYDELTA_C_RUNNER: qemu-arm
        run: go test -run 'TestC' -v .
      - name: Code size (Cortex-M)
        run: scripts/c-size.sh | tee -a "$GITHUB_STEP_SUMMARY"

  c-msp430:
    name: C library on MSP430 (GNU simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Restore cached MSP430 toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/msp430
          key: msp430-${{ runner.os }}-${{ hashFiles('scripts/msp430-toolchain.sh') }}
      - name: Build MSP430-GCC and the GNU MSP430 simulator (when not cached)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev libmpc-dev
          scripts/msp430-toolchain.sh ~/.cache/msp430
      - name: Cache MSP430 toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/msp430
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - run: echo "$HOME/.cache/msp430/bin" >> "$GITHUB_PATH"
      - name: Strict build (16-bit int; small and large memory models)
        run: |
          set -o pipefail
          {
            scripts/c-check.sh msp430-elf-gcc -mcpu=msp430
            scripts/c-check.sh msp430-elf-gcc -mcpu=msp430x
            scripts/c-check.sh msp430-elf-gcc -mcpu=msp430x -mlarge
          } 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: C decoders against the Go decoder, on MSP430X (simulator)
        env:
          TINYDELTA_CC: msp430-elf-gcc -mcpu=msp430x -mlarge -msim
          TINYDELTA_C_RUNNER: scripts/sim-run.sh msp430-elf-run
        run: |
          set -o pipefail
          go test -run 'TestC' -v . 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Code size (MSP430)
        run: |
          set -o pipefail
          scripts/c-size-msp430.sh 2>&1 | tee "$RUNNER_TEMP/step.log" | tee -a "$GITHUB_STEP_SUMMARY"
          sed 's/%/%25/g' "$RUNNER_TEMP/step.log" | awk 'BEGIN { printf "::notice title=MSP430 code size::" } { printf "%s%%0A", $0 } END { print "" }'
      - name: Show the failing step's output as an annotation
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/step.log" ] || exit 0
          grep -v '^=== RUN\|^--- PASS' "$RUNNER_TEMP/step.log" | tail -n 40 |
            sed 's/%/%25/g' | awk 'BEGIN { printf "::error::" } { printf "%s%%0A", $0 } END { print "" }'

  coverage:
    name: Go coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.go.outputs.statements }}
      vectors: ${{ steps.go.outputs.vectors }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Go statement coverage
        id: go
        run: |
          go test -coverprofile="$RUNNER_TEMP/cover.out" ./... > /dev/null
          go tool cover -func="$RUNNER_TEMP/cover.out" | tee "$RUNNER_TEMP/cover.txt"
          total="$(awk '/^total:/ { sub(/%/, "", $3); print $3 }' "$RUNNER_TEMP/cover.txt")"
          echo "statements=$total" >> "$GITHUB_OUTPUT"
          # go test above ran every conformance vector on the Go and C decoders.
          echo "vectors=$(grep -cv '^#\|^$' testdata/vectors.txt)" >> "$GITHUB_OUTPUT"
          { echo "Go statement coverage: $total%"; echo; echo '```'; cat "$RUNNER_TEMP/cover.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Go coverage::$total% of statements"

  badges:
    name: Update coverage badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [c-fuzz, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the badges branch, which holds only badge data
    steps:
      - name: Write the badge data to the badges branch
        env:
          GO_COVERAGE: ${{ needs.coverage.outputs.coverage }}
          C_COVERAGE: ${{ needs.c-fuzz.outputs.coverage }}
          VECTORS: ${{ needs.coverage.outputs.vectors }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shields.io endpoint format; see the badges in README.md.
          badge() { # label percent file
            color="$(awk -v p="$2" 'BEGIN { c = "red"; if (p >= 60) c = "yellow"; if (p >= 75) c = "green"; if (p >= 90) c = "brightgreen"; print c }')"
            printf '{"schemaVersion":1,"label":"%s","message":"%.0f%%","color":"%s"}\n' "$1" "$2" "$color" > "$3"
          }
          mkdir badges && cd badges
          git init -q -b badges
          badge "Go coverage" "$GO_COVERAGE" coverage-go.json
          badge "C coverage" "$C_COVERAGE" coverage-c.json
          # This job only runs when the tests passed, so every vector passed.
          printf '{"schemaVersion":1,"label":"conformance","message":"%s/%s vectors","color":"brightgreen"}\n' \
            "$VECTORS" "$VECTORS" > conformance.json
          cat coverage-*.json
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Coverage badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
