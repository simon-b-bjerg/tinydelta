<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" role="img"><title>A plain tinydelta patch</title><desc>A plain patch is an instruction stream. Its SKIP instructions reuse runs of the old file, its ADD instructions carry the new bytes, and together they build the new file.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;dominant-baseline:central}.t{font-size:14px;font-weight:500;fill:#3d3d3a}.s{font-size:12px;fill:#73726c}.line{stroke:#73726c;stroke-width:1.5;fill:none}.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.head{fill:none;stroke:#73726c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}@keyframes f{to{stroke-dashoffset:-16}}.flow{fill:none;stroke:#7F77DD;stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round;opacity:.8}@media (prefers-reduced-motion:no-preference){.flow{animation:f 1.1s linear infinite}}@media (prefers-color-scheme:dark){text.t{fill:#e8e6dc}text.s{fill:#a8a69c}.box{fill:#30302e;stroke:#a8a69c}.line,.head{stroke:#a8a69c}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t,.purple .s{fill:#CECBF6}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t,.teal .s{fill:#9FE1CB}.coral rect{fill:#712B13;stroke:#F0997B}.coral .t,.coral .s{fill:#F5C4B3}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t,.gray .s{fill:#D3D1C7}}</style><g transform="translate(0,-216)"><polygon points="190,312 233,312 292,350 190,350" fill="#1D9E75" opacity=".2" /><polygon points="235,312 503,312 343,350 292,350" fill="#D85A30" opacity=".2" /><polygon points="505,312 548,312 629,350 343,350" fill="#1D9E75" opacity=".2" /><polygon points="550,312 638,312 640,350 629,350" fill="#D85A30" opacity=".2" /><rect x="190" y="386" width="102" height="40" fill="#1D9E75" opacity=".2" /><rect x="343" y="386" width="286" height="40" fill="#1D9E75" opacity=".2" /><text class="t" x="24" y="258">Plain patch</text><text class="s" x="24" y="276">Sent over the air</text><g class="teal"><rect x="190" y="246" width="43" height="40" rx="4" /><text class="s" x="211.5" y="266" text-anchor="middle">2a</text></g><g class="coral"><rect x="235" y="246" width="43" height="40" rx="4" /><text class="s" x="256.5" y="266" text-anchor="middle">15</text></g><g class="coral"><rect x="280" y="246" width="43" height="40" rx="4" /><text class="s" x="301.5" y="266" text-anchor="middle">42</text></g><g class="coral"><rect x="325" y="246" width="43" height="40" rx="4" /><text class="s" x="346.5" y="266" text-anchor="middle">52</text></g><g class="coral"><rect x="370" y="246" width="43" height="40" rx="4" /><text class="s" x="391.5" y="266" text-anchor="middle">4f</text></g><g class="coral"><rect x="415" y="246" width="43" height="40" rx="4" /><text class="s" x="436.5" y="266" text-anchor="middle">57</text></g><g class="coral"><rect x="460" y="246" width="43" height="40" rx="4" /><text class="s" x="481.5" y="266" text-anchor="middle">4e</text></g><g class="teal"><rect x="505" y="246" width="43" height="40" rx="4" /><text class="s" x="526.5" y="266" text-anchor="middle">72</text></g><g class="coral"><rect x="550" y="246" width="43" height="40" rx="4" /><text class="s" x="571.5" y="266" text-anchor="middle">05</text></g><g class="coral"><rect x="595" y="246" width="43" height="40" rx="4" /><text class="s" x="616.5" y="266" text-anchor="middle">21</text></g><text class="s" x="211" y="300" text-anchor="middle">SKIP 10</text><text class="s" x="369" y="300" text-anchor="middle">ADD 5</text><text class="s" x="526" y="300" text-anchor="middle">SKIP 28</text><text class="s" x="594" y="300" text-anchor="middle">ADD 1</text><text class="t" x="24" y="368">New file</text><g class="teal"><rect x="190" y="350" width="102" height="36" rx="0" /><text class="s" x="241.0" y="368" text-anchor="middle">the quick</text></g><g class="coral"><rect x="292" y="350" width="51" height="36" rx="0" /><text class="s" x="317.5" y="368" text-anchor="middle">BROWN</text></g><g class="teal"><rect x="343" y="350" width="286" height="36" rx="0" /><text class="s" x="486.0" y="368" text-anchor="middle">fox jumps over the lazy dog</text></g><g class="coral"><rect x="629" y="350" width="11" height="36" rx="0" /><text class="s" x="634.5" y="368" text-anchor="middle">!</text></g><text class="t" x="24" y="444">Old file</text><g class="teal"><rect x="190" y="426" width="102" height="36" rx="0" /><text class="s" x="241.0" y="444" text-anchor="middle">the quick</text></g><g class="gray"><rect x="292" y="426" width="51" height="36" rx="0" /><text class="s" x="317.5" y="444" text-anchor="middle">brown</text></g><g class="teal"><rect x="343" y="426" width="286" height="36" rx="0" /><text class="s" x="486.0" y="444" text-anchor="middle">fox jumps over the lazy dog</text></g></g></svg>