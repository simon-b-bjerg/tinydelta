<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 446" role="img"><title>tinydelta address relocation</title><desc>A map in the patch header says which regions moved. The decoder updates addresses in the old image through it, and the patch then only needs the new function.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;dominant-baseline:central}.t{font-size:14px;font-weight:500;fill:#3d3d3a}.s{font-size:12px;fill:#73726c}.line{stroke:#73726c;stroke-width:1.5;fill:none}.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.head{fill:none;stroke:#73726c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}.amber .t{fill:#633806}.amber .s{fill:#854F0B}@keyframes f{to{stroke-dashoffset:-16}}.flow{fill:none;stroke:#BA7517;stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round;opacity:.85}@media (prefers-reduced-motion:no-preference){.flow{animation:f 1.1s linear infinite}}@media (prefers-color-scheme:dark){text.t{fill:#e8e6dc}text.s{fill:#a8a69c}.box{fill:#30302e;stroke:#a8a69c}.line,.head{stroke:#a8a69c}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t,.purple .s{fill:#CECBF6}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t,.teal .s{fill:#9FE1CB}.coral rect{fill:#712B13;stroke:#F0997B}.coral .t,.coral .s{fill:#F5C4B3}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t,.gray .s{fill:#D3D1C7}.amber rect{fill:#633806;stroke:#EF9F27}.amber .t,.amber .s{fill:#FAC775}}</style><polygon points="190,74 590,74 640,104 190,104" fill="#7F77DD" opacity=".14"/><polygon points="190,164 640,164 590,194 190,194" fill="#7F77DD" opacity=".14"/><path class="flow" d="M245 76V102"/><path class="flow" d="M345 76V102"/><path class="flow" d="M245 166V192"/><path class="flow" d="M345 166V192"/><rect x="190" y="238" width="210" height="38" fill="#1D9E75" opacity=".2"/><polygon points="400,238 590,238 640,276 452,276" fill="#1D9E75" opacity=".2"/><rect x="190" y="316" width="210" height="40" fill="#1D9E75" opacity=".2"/><rect x="400" y="316" width="50" height="40" fill="#D85A30" opacity=".2"/><rect x="450" y="316" width="190" height="40" fill="#1D9E75" opacity=".2"/><text class="t" x="24" y="44">Old image</text><text class="s" x="24" y="62">Already on the device</text><g class="teal"><rect x="190" y="30" width="210" height="44" rx="0"/></g><g class="amber"><rect x="198" y="38" width="96" height="28" rx="4"/><text class="s" x="246" y="52" text-anchor="middle">CALL 0x1800</text></g><g class="amber"><rect x="300" y="38" width="92" height="28" rx="4"/><text class="s" x="346" y="52" text-anchor="middle">ptr 0x1900</text></g><g class="teal"><rect x="400" y="30" width="190" height="44" rx="0"/><text class="s" x="495" y="52" text-anchor="middle">foo() at 0x1800</text></g><text class="t" x="24" y="126">Relocation map</text><text class="s" x="24" y="144">In the patch header</text><g class="purple"><rect x="190" y="104" width="450" height="60" rx="8"/><text class="s" x="206" y="122">How regions moved: old start, length, shift</text></g><g class="gray"><rect x="206" y="134" width="150" height="22" rx="4"/><text class="s" x="281" y="145" text-anchor="middle">0x1000, 0x800, +0</text></g><g class="amber"><rect x="366" y="134" width="164" height="22" rx="4"/><text class="s" x="448" y="145" text-anchor="middle">0x1800, 0x600, +0x40</text></g><text class="t" x="24" y="208">Relocated image</text><text class="s" x="24" y="226">Computed while decoding</text><g class="teal"><rect x="190" y="194" width="210" height="44" rx="0"/></g><g class="amber"><rect x="198" y="202" width="96" height="28" rx="4"/><text class="s" x="246" y="216" text-anchor="middle">CALL 0x1840</text></g><g class="amber"><rect x="300" y="202" width="92" height="28" rx="4"/><text class="s" x="346" y="216" text-anchor="middle">ptr 0x1940</text></g><g class="teal"><rect x="400" y="194" width="190" height="44" rx="0"/><text class="s" x="495" y="216" text-anchor="middle">foo(), same bytes</text></g><text class="t" x="24" y="288">Patch</text><text class="s" x="24" y="306">Only what really changed</text><g class="teal"><rect x="190" y="276" width="210" height="40" rx="4"/><text class="s" x="295" y="296" text-anchor="middle">SKIP 0x800</text></g><g class="coral"><rect x="402" y="276" width="46" height="40" rx="4"/><text class="s" x="425" y="296" text-anchor="middle">ADD</text></g><g class="teal"><rect x="452" y="276" width="188" height="40" rx="4"/><text class="s" x="546" y="296" text-anchor="middle">COPY 0x600, delta -0x40</text></g><text class="t" x="24" y="378">New image</text><g class="teal"><rect x="190" y="356" width="210" height="44" rx="0"/></g><g class="amber"><rect x="198" y="364" width="96" height="28" rx="4"/><text class="s" x="246" y="378" text-anchor="middle">CALL 0x1840</text></g><g class="amber"><rect x="300" y="364" width="92" height="28" rx="4"/><text class="s" x="346" y="378" text-anchor="middle">ptr 0x1940</text></g><g class="coral"><rect x="400" y="356" width="50" height="44" rx="0"/><text class="s" x="425" y="378" text-anchor="middle">new</text></g><g class="teal"><rect x="450" y="356" width="190" height="44" rx="0"/><text class="s" x="545" y="378" text-anchor="middle">foo() at 0x1840</text></g><text class="s" x="190" y="424">Teal is reused, coral is sent, amber is updated from the map</text></svg>
