<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" role="img"><title>tinydelta two-pass patch layers</title><desc>The outer instruction stream compresses the inner one by replacing repeated difference bytes with a copy. The inner stream then builds the new file from the old file.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;dominant-baseline:central}.t{font-size:14px;font-weight:500;fill:#3d3d3a}.s{font-size:12px;fill:#73726c}.line{stroke:#73726c;stroke-width:1.5;fill:none}.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.head{fill:none;stroke:#73726c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}.amber .t{fill:#633806}.amber .s{fill:#854F0B}@keyframes f{to{stroke-dashoffset:-16}}.flow{fill:none;stroke:#7F77DD;stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round;opacity:.8}@media (prefers-reduced-motion:no-preference){.flow{animation:f 1.1s linear infinite}}@media (prefers-color-scheme:dark){text.t{fill:#e8e6dc}text.s{fill:#a8a69c}.box{fill:#30302e;stroke:#a8a69c}.line,.head{stroke:#a8a69c}.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t,.purple .s{fill:#CECBF6}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t,.teal .s{fill:#9FE1CB}.coral rect{fill:#712B13;stroke:#F0997B}.coral .t,.coral .s{fill:#F5C4B3}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t,.gray .s{fill:#D3D1C7}.amber rect{fill:#633806;stroke:#EF9F27}.amber .t,.amber .s{fill:#FAC775}}</style><polygon points="190,140 640,140 640,176 190,176" fill="#7F77DD" opacity=".1